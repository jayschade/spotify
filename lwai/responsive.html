<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .item-one,
        .item-two,
        .item-three {
            background-color: gray;
            width: 100px;
            height: 100px;
         }
         .container {
            background-color: blue;
            display: flex;
            flex-direction: column;
         }

         .signup{
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
         }
        
         .box {
            background-color: rebeccapurple;
            width:250px ;
            height:375px;
         }

         .shop {
            display: flex;
            gap: 50px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
         }

         .grid-container {
            background-color: rebeccapurple;
            height: 100vh;
            display: grid;
            grid-template-columns: 100px 50px 80px 100px;
            grid-template-rows: 400px 100px;
            gap: 2px;
         }

         .items {
            background-color: grey;
            padding: 10px;
         }

         .div1 {
            background-color: red;
            padding: 20px;
            grid-row-start: 1;
            grid-row-end: 3;
         }

        .div2 {
            background-color:green;
            padding: 20px;
         }

        .div3 {
            background-color: palegoldenrod;
            padding: 20px;
         }

         .div4 {
            background-color: palegoldenrod;
            padding: 20px;
            grid-column-start: 2;
            grid-column-end: 4;
         }

         .example {
            height: 100vh;
            background-color: black;
            display: grid;
            grid-template-columns: 200px 800px 200px;
            grid-template-rows: 500px;
            justify-content: center;
         }
    </style>
</head>
<body>
    <div class="container">
        <div class="item-one">

        </div>
        <div class="item-two">

        </div>
        <div class="item-three">

        </div>
    </div> 

    <div class="signup">
        <div class="name">
            <label for="">Name</label>
            <input type="text" name="" id="">
        </div>
        <div class="email">
            <label for="">Email</label>
            <input type="text" name="" id="">
        </div>
    </div>

    <div class="shop">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

    <div class="grid-container">
        <div class="items"></div>
        <div class="items"></div>
        <div class="items"></div>
        <div class="items"></div>
        <div class="items"></div>
    </div>

    <div class="example">
        <div class="div1"></div>
        <div class="div2"></div>
        <div class="div3"></div>
        <div class="div4">

        </div>
    </div>
</body>
</html>
