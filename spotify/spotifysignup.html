<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=mobile"
    />
    <link rel="stylesheet" href="spotifysignup.css" />
  </head>
  <body>
    <div class="container" style="align-items: center; justify-content: center">
      <div class="head">
        <img
          src="assets/spotify_logo_white-removebg-preview.png"
          alt=""
          class="logo"
        />
        <h1>
          Sign up to <br />
          start listening
        </h1>
        <label class="e-mail">Email</label>
        <input type="email" required class="input-email" />
      </div>

      <div class="buttons">
        <button class="continue">Continue</button><br />
        <p class="or">or</p>
        <button class="btn-1">
          <span class="cwpn">
            <span class="material-symbols-outlined"> mobile </span>
            <span>Continue with phone number</span></span
          >
        </button>
        <button class="btn-1">
          <span class="cwpn">
            <img
              src="assets/google-logo-removebg-preview.png"
              alt=""
              width="23"
              class="google"
            />
            <span>Continue with Google</span></span
          >
        </button>
        <button class="btn-1">
          <span class="cwpn">
            <img
              src="assets/facebook-removebg-preview.png"
              alt=""
              width="23"
              class="fb"
            />
            <span>Continue with Facebook</span></span
          >
        </button>
        <button class="btn-1">
          <span class="cwpn">
            <img
              src="assets/apple_logo-removebg-preview.png"
              alt=""
              width="32"
              class="apple"
            />
            <span>Continue with Apple</span></span
          >
        </button>
      </div>

      <div class="footer">
        <p class="p-1">Don't have an account?</p>
        <p class="p-2">Sign up</p>
        <p class="p-3">
          This site is protected by reCAPTCHA and the Google
          <a href="" style="color: #7e7e7e">Privacy</a><br />
          <span class="span-1">
            <a href="" style="color: #7e7e7e">Policy</a> and
            <a href="" style="color: #7e7e7e">Terms of service</a>apply</span
          >
        </p>
      </div>
    </div>
  </body>
</html>
